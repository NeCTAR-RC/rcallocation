[metadata]
name = rcallocation
author = ARDC Nectar Cloud Services
author_email = coreservices@ardc.edu.au
license = Apache-2.0
summary = Nectar Allocation System API
description_file =
    README.md
description_content_type = text/markdown
keywords = rcallocation
home_page = https://github.com/NeCTAR-RC/rcallocation
classifier =
    Environment :: OpenStack
    Intended Audience :: Information Technology
    Intended Audience :: System Administrators
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX :: Linux
    Programming Language :: Python
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.14

[files]
packages = rcallocation
include_package_data = True

[entry_points]
console_scripts =
    rcallocation-api = rcallocation.cmd.api:main
    rcallocation-manage = rcallocation.cmd.manage:cli

rcallocation.notifier =
    taynac = rcallocation.notification.drivers:TaynacNotifier
    logging = rcallocation.notification.drivers:LoggingNotifier
    noop = rcallocation.notification.drivers:NoopNotifier

oslo.config.opts =
    rcallocation = rcallocation.common.config:list_opts
oslo.policy.policies =
    rcallocation = rcallocation.common.policies:list_rules
oslo.policy.enforcer =
    rcallocation = rcallocation.policy:get_enforcer

[pbr]
skip_changelog=true
skip_authors=true
