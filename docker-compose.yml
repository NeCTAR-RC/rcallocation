services:
  api:
    image: rcallocation
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - 5000:5000
    volumes:
      - /etc/rcallocation:/etc/rcallocation
    depends_on:
      mariadb:
        condition: service_healthy
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: rcallocation
      MARIADB_DATABASE: rcallocation
      MARIADB_USER: rcallocation
      MARIADB_PASSWORD: rcallocation
    ports:
      - 3306:3306
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb-data:
